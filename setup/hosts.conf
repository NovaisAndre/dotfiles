# Per-host settings for setup/06_perhost.sh
# Format (TAB separated):
#   hostname<TAB>keyboard-layout<TAB>xmodmap-file
#
#   keyboard-layout : value passed to `setxkbmap` (e.g. us, br)
#   xmodmap-file    : file inside this repo, passed to `xmodmap` (may be empty)
#
# Add a new machine by appending a line with its hostname.
# No trailing spaces; use TABS as separators.
husky	us	.XmodmapUs
aspire	br	.Xmodmap