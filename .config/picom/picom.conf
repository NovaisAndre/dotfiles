fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;
glx-no-stencil = true;
use-damage = true;
experimental-backends = true;
opacity-rule = [
  "97:class_g = 'firefox_firefox'",
  #"97:class_g = 'Google-chrome'",
  "95:class_g = 'discord'",
  "95:class_g = 'TelegramDesktop'",
  "95:class_g = 'Insomnia'",
  "85:class_g = 'steam'"
  #"100:class_g = 'kitty'"
];
